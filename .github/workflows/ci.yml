name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Typecheck first: it is the fastest signal and catches the most.
      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds the image but does not push it - this is here so a broken
      # Dockerfile is caught on the PR rather than at deploy time.
      - name: Build image
        run: docker build -t rl-jewels-studio:ci .

      # The production stack is what actually gets deployed, so a typo in it
      # should fail here rather than on the server at 11pm.
      - name: Validate production compose file
        working-directory: deploy
        env:
          STUDIO_DOMAIN: studio.example.com
          SESSION_SECRET: ci-placeholder
          BOOTSTRAP_ADMIN_PASSWORD: ci-placeholder
        run: docker compose config --quiet

      # Caddy terminates TLS in front of the app. A bad Caddyfile means no
      # certificate, which means no camera access on staff phones - so it is
      # worth having its own parser confirm the config, not just our reading
      # of the docs.
      - name: Validate Caddyfile
        run: |
          docker run --rm \
            -e STUDIO_DOMAIN=studio.example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      # Catches an unquoted variable or a typo'd flag before it runs as root
      # on a fresh server.
      - name: Shellcheck deploy scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning deploy/setup.sh deploy/backup.sh deploy/auto-update.sh deploy/reset-password.sh
