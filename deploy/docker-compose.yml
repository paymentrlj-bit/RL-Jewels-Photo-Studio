# Production stack for the Oracle Cloud VM (or any Linux server).
#
# Two containers: the app, and Caddy in front of it doing automatic HTTPS.
# The app is NOT published to the host directly - only Caddy is reachable from
# the internet, so there is no way to hit the app over plain HTTP by accident.

services:
  studio:
    # Built once by .github/workflows/publish.yml on every push to main and
    # pulled ready-made - the server never compiles TypeScript on its own
    # 1 GB box. Override with STUDIO_IMAGE=... in .env to build locally
    # instead (e.g. for testing an unmerged branch).
    image: ${STUDIO_IMAGE:-ghcr.io/paymentrlj-bit/rl-jewels-photo-studio:latest}
    restart: unless-stopped
    # A deploy stops the old container first. Docker's default is to kill it after
    # 10 seconds, which throws away any photo mid-way through the pipeline (the
    # picture is already paid for) and makes it start again from scratch. Give the
    # app time to finish what is running; it stops taking new photos straight away.
    stop_grace_period: 150s
    # No `ports:` on purpose. Caddy reaches it over the private compose
    # network; the internet cannot.
    expose:
      - "3000"
    # Caps this container's memory so a leak or spike gets killed and
    # auto-restarted (restart: unless-stopped) in isolation, instead of the
    # kernel's OOM killer picking victims across the whole host - which is
    # what happened on 2026-09-22 and again on 2026-10-01/02, taking down
    # sshd, fwupd, and unattended-upgrades along with the app itself on a
    # box with no swap. Sized for the box's real ~1GB of RAM; raise this if
    # the instance is ever resized per ORACLE_CLOUD_SETUP.md's documented
    # 12GB shape.
    mem_limit: 500m
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      PORT: 3000
      # Caps V8's heap below the container's mem_limit so Node fails fast
      # and predictably (a clean crash-and-restart) instead of RSS creeping
      # until the kernel OOM-kills the process mid-request.
      NODE_OPTIONS: --max-old-space-size=384

      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env - a long random string, never changed}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD in .env}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}

      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ERP_MAPPING: ${ERP_MAPPING:-generic}
      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-2}
      OCR_SPACE_API_KEY: ${OCR_SPACE_API_KEY:-}

      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${GOOGLE_DRIVE_REFRESH_TOKEN:-}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}

      AXIOM_TOKEN: ${AXIOM_TOKEN:-}
      AXIOM_DATASET: ${AXIOM_DATASET:-rl-jewels-events}

      DETAIL_INVENTORY: ${DETAIL_INVENTORY:-on}
      ANGLE_REQUESTS: ${ANGLE_REQUESTS:-on}
      FAITHFUL_MODE: ${FAITHFUL_MODE:-on}
      DESIGN_MEMORY: ${DESIGN_MEMORY:-on}
      # Output resolution of the studio photo: 1K (default) or 2K.
      ENHANCE_IMAGE_SIZE: ${ENHANCE_IMAGE_SIZE:-1K}
      # Meta (Instagram / Facebook / WhatsApp) catalogue feed. Off until
      # META_FEED_KEY is set in .env to a long random secret.
      META_FEED_KEY: ${META_FEED_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://${STUDIO_DOMAIN}}
      CATALOG_LINK_BASE: ${CATALOG_LINK_BASE:-}
    volumes:
      # THE shoot. Every product, every photo, the whole database.
      # This is the one thing that must be backed up.
      - studio-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # See the studio service's mem_limit comment above - same reasoning.
    mem_limit: 150m
    ports:
      - "80:80"
      - "443:443"
    environment:
      STUDIO_DOMAIN: ${STUDIO_DOMAIN:?set STUDIO_DOMAIN in .env - e.g. studio.yourdomain.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Keeping them on a volume means a restart does
      # not re-request a certificate and burn Let's Encrypt rate limits.
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    depends_on:
      - studio

volumes:
  studio-data:
  caddy-data:
  caddy-config:
  caddy-logs:
